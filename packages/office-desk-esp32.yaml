substitutions:
  device_name: Flexispot desk
  name: office-desk-flexispot
  unit_of_measurement: "cm" # or "in"
  min_height: "73.5"
  max_height: "123"
  ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password
  ap_fallback_password: !secret ap_fallback_password
  tx_pin: GPIO17 # TXD 2
  rx_pin: GPIO16 # RXD 2
  screen_pin: GPIO23
  encryption_key: !secret encryption_key
  # Rename to match your control panel (e.g. "Preset 3" / "Preset 4")
  preset_1_name: "Preset 1"
  preset_1_icon: mdi:numeric-1-box
  preset_2_name: "Preset 2"
  preset_2_icon: mdi:numeric-2-box
  preset_3_name: "Stand"
  preset_3_icon: mdi:human-handsup
  preset_4_name: "Sit"
  preset_4_icon: mdi:chair-rolling

external_components:
  source: github://iMicknl/LoctekMotion_IoT
  components: [ loctekmotion_desk_height ]

esp32:
  board: esp32dev
  framework:
    type: esp-idf

esphome:
  name: ${name}
  friendly_name: ${device_name}
  comment: Used to control your ${device_name} standing desk via Home Assistant.

  # Delay UART interaction on boot to give the desk controller time to initialize.
  # After the delay, wake the desk by sending the "M" command to request the current height.
  on_boot:
    priority: -100
    then:
      - if:
          condition:
            switch.is_on: switch_live_tracking
          then:
            - switch.turn_off: switch_virtual_screen
      - delay: 10s
      - script.execute: prepare_command
      - script.wait: prepare_command
      - delay: 100ms # the box needs ~300 ms after the first Wake Up before it accepts a command
      - uart.write:
          id: desk_uart
          data: [0x9b, 0x06, 0x02, 0x20, 0x00, 0xac, 0xb8, 0x9d]

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: ${encryption_key}

ota:
  platform: esphome

wifi:
  ssid: ${ssid}
  password: ${wifi_password}

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: ${device_name} Fallback Hotspot
    password: ${ap_fallback_password}

captive_portal:

uart:
  - id: desk_uart
    baud_rate: 9600
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
    # debug:

sensor:
  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 60s

  - platform: uptime
    name: Uptime

  - platform: loctekmotion_desk_height
    id: "desk_height"
    name: Desk height
    unit_of_measurement: ${unit_of_measurement}
    heartbeat:
      id: desk_heartbeat
      name: Desk heartbeat
      internal: true
      on_press:
        - script.execute: live_poll
    on_value_range:
    - below: ${min_height}
      then:
        - switch.turn_off: switch_down
        - button.press: button_wake_screen
    - above: ${max_height}
      then:
        - switch.turn_off: switch_up
        - button.press: button_wake_screen
    on_value:
      then:
        - cover.template.publish:
            id: desk_cover
            position: !lambda |-
                // The sensor outputs values from min_height (cm) to max_height (cm)
                // We need to translate this to 0 - 1 scale.
                float position = (float(x) - float(${min_height})) / (float(${max_height}) - float(${min_height}));
                return position;
        - component.update: set_desk_height

switch:
  - platform: gpio
    name: "Virtual screen" # PIN20
    id: switch_virtual_screen
    pin:
      number: ${screen_pin}
      mode: OUTPUT
    restore_mode: ALWAYS_ON
    entity_category: "config"
    internal: true

  # Opt-in: keep PIN 20 LOW while idle so the control box heartbeat reveals
  # when the physical control panel is used, and poll the height once per
  # second while the heartbeat runs. Off (default) = PIN 20 permanently HIGH,
  # no polling. Turning it on starts a normal 25 s hold, so a move that is in
  # progress is not interrupted.
  - platform: template
    name: "Live height tracking"
    id: switch_live_tracking
    icon: mdi:eye-refresh
    entity_category: "config"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    on_turn_on:
      - script.execute: wake_line
      - script.execute: live_poll
    on_turn_off:
      - script.stop: live_poll
      - script.stop: wake_line
      - switch.turn_on: switch_virtual_screen

  - platform: uart
    name: "Up"
    id: switch_up
    icon: mdi:arrow-up-bold
    data: [0x9b, 0x06, 0x02, 0x01, 0x00, 0xfc, 0xa0, 0x9d]
    uart_id: desk_uart
    send_every: 108ms
    internal: true
    on_turn_on:
      - script.execute: prepare_command
      - script.wait: prepare_command

  - platform: uart
    name: "Down"
    id: switch_down
    icon: mdi:arrow-down-bold
    data: [0x9b, 0x06, 0x02, 0x02, 0x00, 0x0c, 0xa0, 0x9d]
    uart_id: desk_uart
    send_every: 108ms
    internal: true
    on_turn_on:
      - script.execute: prepare_command
      - script.wait: prepare_command

  - platform: uart
    name: "Alarm off"
    id: switch_alarm
    icon: mdi:alarm
    data: [0x9b, 0x06, 0x02, 0x40, 0x00, 0xAC, 0x90, 0x9d]
    uart_id: desk_uart
    send_every: 108ms
    on_turn_on:
      - script.execute: prepare_command
      - script.wait: prepare_command
      - delay: 3000ms
      - switch.turn_off: switch_alarm
    entity_category: "config"

  - platform: uart
    name: "Child lock"
    id: switch_child_lock
    icon: mdi:account-lock
    data: [0x9b, 0x06, 0x02, 0x20, 0x00, 0xac, 0xb8, 0x9d]
    uart_id: desk_uart
    send_every: 108ms
    on_turn_on:
      - script.execute: prepare_command
      - script.wait: prepare_command
      - delay: 5000ms
      - switch.turn_off: switch_child_lock
    entity_category: "config"

script:
  # Live height tracking: hold PIN 20 HIGH for 25 s (long enough for a full
  # preset travel) after the last command, then release it so the heartbeat can
  # signal activity on the physical panel. No-op when live tracking is off
  # (PIN 20 stays permanently HIGH).
  - id: wake_line
    mode: restart
    then:
      - if:
          condition:
            switch.is_on: switch_live_tracking
          then:
            - switch.turn_on: switch_virtual_screen
            - delay: 25s
            - switch.turn_off: switch_virtual_screen

  # Make the control box ready for a command. With live tracking off this is the
  # usual "Wake screen + 200 ms" sequence.
  - id: prepare_command
    mode: single
    then:
      - if:
          condition:
            switch.is_off: switch_virtual_screen
          then:
            - script.execute: wake_line
            - delay: 1s # PIN 20 must be HIGH for about 1 s before commands are accepted
          else:
            - script.execute: wake_line
      - script.stop: live_poll # no poll between our Wake Up and the command
      - button.press: button_wake_screen
      - delay: 200ms
      - script.execute: live_poll

  # Live height tracking: while the heartbeat runs (PIN 20 HIGH, raised by us
  # or by a key press on the physical panel), ask for the height once per
  # second. Restarted after every command so the first poll comes 1 s after it.
  # While a key frame is being streamed, keep the line awake instead of polling.
  - id: live_poll
    mode: restart
    then:
      - while:
          condition:
            and:
              - switch.is_on: switch_live_tracking
              - binary_sensor.is_on: desk_heartbeat
          then:
            - delay: 1s
            - if:
                condition:
                  or:
                    - switch.is_on: switch_up
                    - switch.is_on: switch_down
                    - switch.is_on: switch_alarm
                    - switch.is_on: switch_child_lock
                then:
                  - script.execute: wake_line
                else:
                  - button.press: button_wake_screen

button:
  - platform: template
    name: ${preset_1_name}
    icon: ${preset_1_icon}
    on_press:
      - script.execute: prepare_command
      - script.wait: prepare_command
      - uart.write:
          id: desk_uart
          data: [0x9b, 0x06, 0x02, 0x04, 0x00, 0xac, 0xa3, 0x9d]

  - platform: template
    name: ${preset_2_name}
    icon: ${preset_2_icon}
    on_press:
      - script.execute: prepare_command
      - script.wait: prepare_command
      - uart.write:
          id: desk_uart
          data: [0x9b, 0x06, 0x02, 0x08, 0x00, 0xac, 0xa6, 0x9d]

  - platform: template
    name: ${preset_4_name}
    icon: ${preset_4_icon}
    on_press:
      - script.execute: prepare_command
      - script.wait: prepare_command
      - uart.write:
          id: desk_uart
          data: [0x9b, 0x06, 0x02, 0x00, 0x01, 0xac, 0x60, 0x9d]

  - platform: template
    name: ${preset_3_name}
    icon: ${preset_3_icon}
    on_press:
      - script.execute: prepare_command
      - script.wait: prepare_command
      - uart.write:
          id: desk_uart
          data: [0x9b, 0x06, 0x02, 0x10, 0x00, 0xac, 0xac, 0x9d]

  - platform: template
    name: "Memory"
    id: button_m
    icon: mdi:alpha-m-box
    entity_category: "config"
    on_press:
      - script.execute: prepare_command
      - script.wait: prepare_command
      - uart.write:
          id: desk_uart
          data: [0x9b, 0x06, 0x02, 0x20, 0x00, 0xac, 0xb8, 0x9d]

  - platform: template
    name: "Wake screen"
    id: button_wake_screen
    icon: mdi:gesture-tap-button
    entity_category: "config"
    on_press:
      - uart.write:
          id: desk_uart
          data: [0x9b, 0x06, 0x02, 0x00, 0x00, 0x6c, 0xa1, 0x9d]

  - platform: template
    name: "Alarm"
    id: button_alarm
    icon: mdi:alarm
    on_press:
      - script.execute: prepare_command
      - script.wait: prepare_command
      - uart.write:
          id: desk_uart
          data: [0x9b, 0x06, 0x02, 0x40, 0x00, 0xAC, 0x90, 0x9d]

  - platform: restart
    name: "Restart"
    entity_category: "config"

cover:
  - platform: template
    id: "desk_cover"
    icon: mdi:desk # or mdi:human-male-height-variant
    name: "Desk"
    device_class: blind # makes it easier to integrate with Google/Alexa
    has_position: true
    position_action:
      - if:
          condition:
            - lambda: !lambda |-
                return pos > id(desk_cover).position;
          then:
            - cover.open: desk_cover
            - wait_until:
                lambda: |-
                  return id(desk_cover).position  >= pos;
            - cover.stop: desk_cover
          else:
            - cover.close: desk_cover
            - wait_until:
                lambda: |-
                  return id(desk_cover).position <= pos;
            - cover.stop: desk_cover
    stop_action:
      - switch.turn_off: switch_up
      - switch.turn_off: switch_down
      - button.press: button_wake_screen
    open_action:
      - switch.turn_off: switch_down
      - switch.turn_on: switch_up
    close_action:
      - switch.turn_off: switch_up
      - switch.turn_on: switch_down
    optimistic: false

number:
  - platform: template
    name: "Desk height"
    id: set_desk_height
    min_value: ${min_height}
    max_value: ${max_height}
    icon: "mdi:counter"
    unit_of_measurement: ${unit_of_measurement}
    device_class: "distance"
    step: 0.1
    lambda: !lambda |-
      return id(desk_height).state;
    set_action:
      - if:
          condition:
            - lambda: !lambda |-
                return x > id(desk_height).state;
          then:
            - cover.open: desk_cover
            - wait_until:
                lambda: |-
                  return id(desk_height).state  >= x;
            - cover.stop: desk_cover
          else:
            - cover.close: desk_cover
            - wait_until:
                lambda: |-
                  return id(desk_height).state <= x;
            - cover.stop: desk_cover
