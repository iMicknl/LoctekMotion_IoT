substitutions:
  device_name: Flexispot desk
  name: office-desk-flexispot
  tx_pin: D5
  rx_pin: D6
  rx_pin_keypad: D7

external_components:
  - source: ../components
    components:
      - loctekmotion_protocol
      - loctekmotion_desk_height
      - loctekmotion_desk_command

esphome:
  name: ${name}
  friendly_name: ${device_name}

esp8266:
  board: d1_mini

logger:

uart:
  - id: desk_uart
    baud_rate: 9600
    tx_pin: ${tx_pin}
    rx_pin: ${rx_pin}
  - id: keypad_uart
    baud_rate: 9600
    rx_pin: ${rx_pin_keypad}

sensor:
  - platform: loctekmotion_desk_height
    id: desk_height
    name: Desk height
    uart_id: desk_uart
  - platform: loctekmotion_desk_command
    id: desk_command
    name: Desk command
    uart_id: keypad_uart
