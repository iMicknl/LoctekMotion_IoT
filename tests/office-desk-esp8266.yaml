substitutions:
  device_name: Flexispot desk
  name: office-desk-flexispot
  unit_of_measurement: cm
  min_height: "73.5"
  max_height: "123"
  ssid: your_wifi_ssid
  wifi_password: your_wifi_password
  ap_fallback_password: your_ap_fallback_password
  tx_pin: D5
  rx_pin: D6
  screen_pin: D2
  encryption_key: iOZqtvw31Yy6sasRl5h2DElG2VDlqW2WjJEKObVN8bg=

external_components:
  - source: ../components
    components: [loctekmotion_desk_height]

esphome:
  name: ${name}
  friendly_name: ${device_name}

esp8266:
  board: d1_mini

logger:

uart:
  id: desk_uart
  baud_rate: 9600
  tx_pin: ${tx_pin}
  rx_pin: ${rx_pin}

sensor:
  - platform: loctekmotion_desk_height
    id: desk_height
    name: Desk height
    uart_id: desk_uart
